[project]
name = "ebbinghaus-cli"
version = "0.1.0"
authors = [
  { name = "Medi194"}
]
description = "Command-line ebbinghaus review tool"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "mypy>=1.0",
]

[project.scripts]
ebbinghaus = "ebbinghaus_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
